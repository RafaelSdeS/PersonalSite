<!DOCTYPE html>
<!-- Link-preview card (og:image), 1200×630. Regenerate from the repo root (see CLAUDE.md):
     chromium-browser --headless --hide-scrollbars --virtual-time-budget=3000 --window-size=1200,630 \
       --screenshot="$PWD/og.png" "file://$PWD/tools/og-card.html"          (EN; add ?lang=pt for PT)
     then convert the PNG to assets/images/og-en.jpg / og-pt.jpg (JPEG q85). Texts mirror the hero of index*.html. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;700&display=block" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0e0f11; color: #e6e8eb; font-family: 'Space Grotesk', sans-serif; padding: 36px; display: grid; grid-template-columns: 1fr 380px; gap: 16px; }
  .tile { background: #15171a; border: 1px solid #23262b; border-radius: 24px; overflow: hidden; }
  .intro { padding: 56px 56px 48px; display: flex; flex-direction: column; }
  .label { font: 500 17px 'JetBrains Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: hsl(205, 85%, 62%); }
  .rule { width: 56px; height: 2px; background: hsl(205, 85%, 62%); margin-top: 20px; }
  h1 { margin-top: 28px; font-size: 76px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 700; }
  .role { margin-top: 24px; font-size: 28px; color: #9aa0a8; }
  .url { margin-top: auto; font: 500 17px 'JetBrains Mono', monospace; color: #7c828a; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
</style>
</head>
<body>
  <section class="tile intro">
    <span class="label" id="label">Computer Engineering @ UFRGS</span>
    <span class="rule"></span>
    <h1>Rafael Silva<br />de Souza</h1>
    <p class="role" id="role">Hardware Acceleration, HPC &amp; Quant Finance</p>
    <p class="url">rafaelsdes.github.io/PersonalSite</p>
  </section>
  <figure class="tile portrait"><img src="../assets/images/rafael-portrait.jpg" alt="" /></figure>
  <script>
    if (/lang=pt/.test(location.search)) {
      document.documentElement.lang = "pt-BR";
      document.getElementById("label").textContent = "Engenharia de Computação @ UFRGS";
      document.getElementById("role").textContent = "Aceleração de Hardware, HPC & Finanças Quantitativas";
    }
  </script>
</body>
</html>
